# PayeTam — nginx, production (M20).
#
# nginx is the only container with a published port, so everything that decides
# what the internet can reach is either here or in one of the two site files it
# includes. Three things are settled at this level rather than per site, because
# getting one of them wrong on a single site is the kind of mistake that is
# invisible until it is exploited:
#
#   * `/metrics` is refused here, unconditionally, before either site is consulted.
#   * An unrecognised `Host` is dropped without a response.
#   * Request bodies are bounded before a byte reaches the API.

user  nginx;
# One worker per core. This is a small VPS; the number is the point of `auto`.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    #
    # `$request_id` is the same value the API echoes back as `X-Request-Id` and
    # writes into every structured log line (apps/api/src/common/observability.ts),
    # so one identifier joins an nginx access line to the API's own record of the
    # same request. Without it the two logs cannot be correlated at all.
    #
    # **The client address is deliberately still here.** nginx's access log is
    # operational and short-lived; ADR-0009's rule about never storing a raw IP is
    # about the *database*, where addresses are kept as peppered HMACs. Rotation
    # below is what bounds how long this one survives.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # The version number tells an attacker which advisories to try first, and
    # tells nobody else anything.
    server_tokens   off;

    # ── Request bounds (T12) ─────────────────────────────────────────────────
    #
    # No upload path is active in the product today, so a request body larger
    # than a form submission is either a mistake or an attempt. A site that later
    # needs more can raise it in its own `location`, which is a visible change in
    # a reviewed file.
    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;
    large_client_header_buffers 4 16k;

    # ── Rate limiting, as a coarse outer layer ───────────────────────────────
    #
    # Not a replacement for the application's limiter, which is per subject, is
    # aware of what the request is trying to do, and records a crossing in
    # `audit_log` (packages/platform/src/ratelimit). This one exists for the
    # traffic that should never reach Node at all — a flood that would otherwise
    # spend a worker, a database connection and a Redis round trip to be refused.
    #
    # 10 MB holds roughly 160k addresses; `nodelay` on the burst so a legitimate
    # page load firing several requests at once is not queued behind itself.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # ── Compression ──────────────────────────────────────────────────────────
    #
    # Static assets only, and never a proxied API response: the pairing of
    # compression with a secret in the body is BREACH, and the admin API returns
    # both a CSRF token and session-scoped data.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      off;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff2;

    # ── TLS, shared by both sites ────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    # Off deliberately: a resumption ticket encrypted under a key that never
    # rotates is what removes forward secrecy from a TLS 1.2 session.
    ssl_session_tickets       off;

    # ── Upstream ─────────────────────────────────────────────────────────────
    #
    # A named upstream rather than `proxy_pass http://api:3000` at each location,
    # for the keepalive pool: without it every proxied request opens a new TCP
    # connection to the API, which on a busy list screen is more connection setup
    # than work.
    #
    # Docker's embedded DNS resolves `api` to whatever address the container has
    # after a redeploy; nginx resolves an upstream name at startup, which is why
    # `scripts/deploy.sh` restarts nginx after the API is replaced rather than
    # leaving it pointed at an address that no longer exists.
    upstream payetam_api {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Shared proxy behaviour. `include`d by every location that proxies, so a new
    # route cannot forget one of these headers.
    #
    # **`X-Forwarded-For` is set to `$remote_addr`, not `$proxy_add_x_forwarded_for`.**
    # This nginx is the edge — the domain is DNS-only with no CDN in front — so
    # any `X-Forwarded-For` already on the request was put there by the client,
    # and appending to it means passing an attacker-authored list to the thing
    # that decides which rate-limit bucket they land in. Replacing it means the
    # header contains exactly one address and it is the one nginx measured.
    # If a CDN is ever put in front of this, that decision has to be revisited
    # here and in `TRUST_PROXY` together.

    # ── The catch-all server ─────────────────────────────────────────────────
    #
    # `default_server`, so it answers anything that does not match a site below:
    # a request to the bare IP, a probe for someone else's hostname, a scan.
    # 444 closes the connection without a response, which costs nothing to send
    # and gives a scanner nothing to fingerprint.
    #
    # It also carries the container's own health endpoint, on 127.0.0.1 only.
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        location = /nginx-health {
            allow 127.0.0.1;
            allow ::1;
            deny  all;
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The ACME challenge has to work before any certificate exists, and it
        # arrives over plain HTTP at whatever name is being validated — including
        # the first time, when the site file for that name is still serving a
        # self-signed placeholder.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type "text/plain";
        }

        location / {
            return 444;
        }
    }

    include /etc/nginx/sites-enabled/*.conf;
}
