# Response headers for admin.paayatam.ir.
#
# Stricter than the Mini App's on every axis that differs, and each difference
# has a reason rather than a preference behind it:
#
#  * `X-Frame-Options: DENY` and `frame-ancestors 'none'`. Nothing embeds the
#    panel, and a framed admin session is clickjacking against an operator who
#    can suspend accounts and adjust coin balances.
#  * No outside origin anywhere in the CSP. The panel loads no third-party
#    script; the Mini App's one exception (telegram.org) has no counterpart here.
#  * `noindex, nofollow`. `apps/admin/index.html` already carries the meta tag;
#    the header covers the responses a crawler sees that are not that document.
#
# Same nginx rule as the Mini App's snippet: `add_header` in a `location`
# replaces the inherited set, so every location that adds a header includes this.

add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header X-Frame-Options            "DENY" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag               "noindex, nofollow, noarchive" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
