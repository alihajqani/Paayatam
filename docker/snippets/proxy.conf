# Shared by every location that forwards to the API.
#
# `include`d rather than repeated so a route added later cannot arrive with five
# of the six headers — which is a failure that looks like nothing until the one
# missing header turns out to be the one the rate limiter reads.

proxy_http_version 1.1;
# Empty, not `keep-alive`: the hop-by-hop `Connection` header from the client
# must not be forwarded, and clearing it is what lets the upstream keepalive pool
# in `nginx.conf` actually be reused.
proxy_set_header Connection        "";

proxy_set_header Host              $host;

# **Replaced, not appended.** This nginx is the edge — DNS-only, no CDN — so any
# `X-Forwarded-For` already present was written by the client, and forwarding an
# attacker-authored list to the process that decides their rate-limit bucket and
# their `ip_hash` is the whole vulnerability. One address, measured here.
# The API only believes this header from the hops named in `TRUST_PROXY`.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# The same id nginx logs and the API echoes back, so one string joins the two
# records of a request (apps/api/src/common/observability.ts).
proxy_set_header X-Request-Id      $request_id;

# Long enough for a slow query under load, short enough that a wedged upstream
# does not hold a client socket for a minute.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Off: responses are JSON and small, and buffering only adds latency to the
# first byte on the interactive paths.
proxy_buffering off;

# A 502 from a restarting API should be retried against the same upstream rather
# than surfaced, but a non-idempotent request must never be replayed — POSTing a
# join twice is exactly the duplicate the idempotency keys exist to prevent.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
