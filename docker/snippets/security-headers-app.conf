# Response headers for app.paayatam.ir (the Mini App).
#
# A snippet rather than four lines in the server block, because of an nginx rule
# that is easy to be bitten by: `add_header` in a `location` **replaces** the
# whole inherited set rather than adding to it. Any location here that sets its
# own `Cache-Control` would therefore silently ship without a CSP. Including this
# file in each of them is what keeps that from happening.

add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# NOTE — deliberately no `X-Frame-Options: DENY` on this host.
#
# Telegram Web loads a Mini App **inside an iframe**. `DENY` would leave the
# product working in the phone clients and blank on desktop web — a failure only
# one tester would ever see. `frame-ancestors` below does the same job with the
# one exception that has to exist. The admin panel, which nothing embeds, does
# use `DENY`.
#
# `script-src` allows exactly one outside origin: telegram.org serves
# `telegram-web-app.js`, which injects `window.Telegram.WebApp`
# (apps/miniapp/index.html). The font is self-hosted from node_modules precisely
# so this list stays one entry long (ADR-0003).
#
# `'unsafe-inline'` appears in `style-src` and nowhere else: Vue writes inline
# styles for its bindings and for the Telegram theme variables. `script-src` has
# neither `'unsafe-inline'` nor `'unsafe-eval'`, which is the half that matters
# for T5.1.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors https://telegram.org https://*.telegram.org" always;
