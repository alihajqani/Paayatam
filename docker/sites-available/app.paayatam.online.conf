# app.paayatam.online — the Mini App, and the API surface it talks to.
#
# **The bundle and the API must share an origin.** This is not a preference; it
# is forced by the code. `apps/miniapp/src/api/client.ts` builds request paths as
# `${BASE_URL}/api/v1…` with `BASE_URL` empty by default, and
# `apps/api/src/common/security-headers.ts` sends no CORS headers at all. A
# separate `api.paayatam.online` would fail every request in the browser, and would
# fail on the CORS preflight rather than anywhere informative. So this one server
# block does both jobs: static files from /srv/www/miniapp, and a proxy for the
# three API prefixes.

server {
    listen      80;
    listen      [::]:80;
    server_name app.paayatam.online;

    # Served over plain HTTP on purpose, and it has to stay above the redirect:
    # Let's Encrypt validates over HTTP, and a 301 towards a certificate that does
    # not exist yet is the loop that makes a first issuance impossible.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name app.paayatam.online;

    # These three files exist before certbot has ever run: `scripts/init-letsencrypt.sh`
    # writes a self-signed placeholder for each name first, because nginx refuses
    # to start when an `ssl_certificate` is missing — and nginx has to be running
    # to answer the ACME challenge that produces the real one.
    ssl_certificate         /etc/letsencrypt/live/app.paayatam.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/app.paayatam.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.paayatam.online/chain.pem;

    # Docker's embedded resolver, for the OCSP responder lookup. Stapling is a
    # no-op while the placeholder is in place and starts working on its own once
    # a real chain is issued.
    resolver            127.0.0.11 valid=30s ipv6=off;
    resolver_timeout    5s;
    ssl_stapling        on;
    ssl_stapling_verify on;

    root  /srv/www/miniapp;
    index index.html;

    include /etc/nginx/snippets/security-headers-app.conf;

    # ── Closed from the internet ─────────────────────────────────────────────
    #
    # `/metrics` publishes request volumes, error rates and queue depths — the
    # product's traffic and its health, to anyone who asks. The API refuses it
    # too (apps/api/src/metrics/metrics.controller.ts), but that check allows
    # *private* addresses, and behind a proxy every request arrives from one.
    # Without this block the endpoint would be world-readable through nginx even
    # though the code reads as though it were closed. 404, matching the API.
    location = /metrics {
        access_log off;
        return 404;
    }

    # Readiness names which dependency is down, which is precisely the fact an
    # attacker wants during an outage. No client of this host needs it —
    # `scripts/smoke-tests.sh` reads it from inside the compose network.
    location = /ready {
        access_log off;
        return 404;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    #
    # Authentication first: nginx matches the longest prefix, so `/api/v1/auth/`
    # wins over `/api/` for the one endpoint reachable without an account. Its
    # bucket sits in front of the application's own AUTH limiter rather than
    # replacing it — this one refuses a flood before it costs a worker, a
    # database connection and a Redis round trip.
    location /api/v1/auth/ {
        limit_req  zone=login burst=10 nodelay;
        limit_conn perip 24;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api;
    }

    # ── The catalog, and the one gzip exception ──────────────────────────────
    #
    # `gzip_proxied off` in nginx.conf is deliberate and stays: compressing a
    # response that mixes a secret with attacker-influenced input is BREACH, and
    # most of this API's responses are session-scoped.
    #
    # `GET /api/v1/catalog` is the exception because it has **neither half of
    # that pairing**: it is the same bytes for every caller, it contains no
    # token, no session data and nothing derived from the request, and the
    # handler sets `Cache-Control: public` on exactly that basis. What it does
    # have is size — 31 provinces and 1,252 cities is ~190 KiB, and ~15 KiB
    # compressed, on connections where that difference is seconds.
    #
    # An exact-match location, not a prefix: `= /api/v1/catalog` cannot widen to
    # cover a future `/api/v1/catalog/<something>` that does carry per-user data.
    location = /api/v1/catalog {
        limit_req  zone=api burst=40 nodelay;
        limit_conn perip 24;
        gzip_proxied any;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api;
    }

    location /api/ {
        limit_req  zone=api burst=40 nodelay;
        limit_conn perip 24;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api;
    }

    # ── Telegram webhook ─────────────────────────────────────────────────────
    #
    # The real path is `/telegram/webhook/<TELEGRAM_WEBHOOK_SECRET_PATH>` —
    # `@Controller('telegram')` plus `@Post('webhook/:secretPath')`.
    #
    # **Not rate limited.** Telegram delivers sequentially per chat and retries
    # what it cannot deliver, so throttling here converts a burst of legitimate
    # updates into a redelivery storm. The endpoint is already cheap and already
    # refuses a wrong secret before it parses the body.
    #
    # `access_log off` because the secret path is *in the URL*: every access line
    # would write a live credential to disk (T15).
    location /telegram/webhook/ {
        access_log off;
        client_max_body_size 256k;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api;
    }

    # ── Health ───────────────────────────────────────────────────────────────
    #
    # Public, so an external monitor can reach it. It discloses that the process
    # is up and how long it has been up, and nothing else.
    location = /health {
        access_log off;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api/health;
    }

    # ── Static ───────────────────────────────────────────────────────────────
    #
    # Vite fingerprints everything under /assets/, so the bytes at a given URL
    # never change and a year is safe. `immutable` is what stops a browser
    # revalidating on reload — the difference between a warm start and one round
    # trip per file on a mobile network (ADR-0003).
    location /assets/ {
        include    /etc/nginx/snippets/security-headers-app.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    # The entry point is the opposite case: it names the current bundle, so a
    # cached copy is how a browser goes on loading yesterday's build after a deploy.
    location = /index.html {
        include    /etc/nginx/snippets/security-headers-app.conf;
        add_header Cache-Control "no-store" always;
    }

    # History-mode routing: an unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
