# admin.paayatam.ir — the operator panel, and the admin API.
#
# **A dedicated host, not a sub-path of the Mini App's.** `docs/admin-panel.md`
# once showed `location /admin { alias …; }`, and that cannot work with this
# build: neither `vite.config.ts` sets `base`, so the bundle references its
# assets at `/assets/…` and a sub-path mount 404s every one of them. A host of
# its own serves the panel at `/`, which is what the build already assumes.
#
# **Same origin as the admin API, for the same reason as the Mini App and one
# more.** The session cookie is set with `path=/admin`, `SameSite=Lax`, `Secure`
# and no `Domain` (apps/api/src/admin/admin.controller.ts), so it is host-only:
# a panel on a different origin would simply never send it, and every request
# would 401 with nothing in the browser console to explain why.
#
# Access control is the panel's own login — TOTP plus the session cookie
# (ADR-0010). No network restriction is applied here. That is a deliberate,
# recorded decision rather than an omission; SECURITY.md carries it, along with
# the `allow`/`deny` block to paste in when an operator has a fixed address.

server {
    listen      80;
    listen      [::]:80;
    server_name admin.paayatam.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin.paayatam.ir;

    ssl_certificate         /etc/letsencrypt/live/admin.paayatam.ir/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/admin.paayatam.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.paayatam.ir/chain.pem;

    resolver            127.0.0.11 valid=30s ipv6=off;
    resolver_timeout    5s;
    ssl_stapling        on;
    ssl_stapling_verify on;

    root  /srv/www/admin;
    index index.html;

    include /etc/nginx/snippets/security-headers-admin.conf;

    # ── Where an IP allowlist goes, if you ever add one ──────────────────────
    #
    # Uncomment and list the addresses that may reach the panel. Put it here, at
    # server level, so it covers the API and the bundle together — an allowlist
    # on `/admin/v1/` alone leaves the login page reachable, and one on `/` alone
    # leaves the API reachable, which is the half that matters.
    #
    #   allow 203.0.113.7;      # the operator's fixed address
    #   deny  all;

    # ── Closed from the internet ─────────────────────────────────────────────
    location = /metrics {
        access_log off;
        return 404;
    }

    location = /ready {
        access_log off;
        return 404;
    }

    # The Mini App's API has no business being reachable on this host: it would
    # be a second, unmonitored front door to the same endpoints under a name
    # whose whole purpose is to be restricted.
    location /api/ {
        access_log off;
        return 404;
    }

    location /telegram/ {
        access_log off;
        return 404;
    }

    # ── Admin API ────────────────────────────────────────────────────────────
    #
    # `@Controller('admin/v1')`. The trailing slash matters: `/admin/v1/` and not
    # `/admin/`, so the path never collides with a client route in the panel's
    # own router — and the cookie's `path=/admin` still covers it.
    #
    # The `login` bucket, not the general one: this is the only unauthenticated
    # endpoint on the host, and ADMIN_LOGIN's own limit is 10 per five minutes
    # per address, which this sits comfortably above.
    location /admin/v1/ {
        limit_req  zone=login burst=20 nodelay;
        limit_conn perip 16;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api;
    }

    # ── Health ───────────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://payetam_api/health;
    }

    # ── Static ───────────────────────────────────────────────────────────────
    location /assets/ {
        include    /etc/nginx/snippets/security-headers-admin.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /index.html {
        include    /etc/nginx/snippets/security-headers-admin.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
