<!doctype html>
<!--
  `dir="rtl"` and `lang="fa"` at the root, exactly as the Mini App does it.

  The plan (§3.7) calls the panel "desktop-first, LTR-capable". Both halves hold
  here: the layout uses logical properties only, so switching this one attribute
  is the whole of an LTR locale — and the people who work the moderation queue
  read Persian, so that is what it renders in.
-->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>پنل مدیریت پایه‌تَم</title>
    <!-- Same-origin. A copy of the Mini App's; see docs/brand.md. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
