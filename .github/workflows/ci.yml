name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by packages/config at import time. Not a real credential — CI never
  # connects to a database in the unit job.
  DATABASE_URL: postgresql://payetam:ci@localhost:5432/payetam?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed. Everything that imports
      # @payetam/db fails to type-check without this step.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test --project unit

      # T10: Prisma parameterises queries, but raw SQL is permitted via tagged
      # $queryRaw templates. A concatenated or interpolated non-tagged query is an
      # injection waiting to happen, so fail the build on one.
      #
      # Matches call sites — a leading dot and an opening paren — not the bare
      # names. Prisma's own generated client declares and documents both methods,
      # so the looser pattern flagged the client we generated two steps earlier.
      # `generated` and `dist` are excluded for the same reason: neither is code
      # anyone here wrote.
      - name: Reject string-concatenated SQL
        run: |
          if grep -rnE '\.\$(query|execute)RawUnsafe\(' \
               --include='*.ts' \
               --exclude-dir=generated --exclude-dir=dist --exclude-dir=node_modules \
               apps packages tools test 2>/dev/null; then
            echo "::error::Unsafe raw SQL detected. Use tagged \$queryRaw templates (ADR-0002, threat T10)."
            exit 1
          fi
          echo "No unsafe raw SQL found."

      # T5.1: Vue escapes interpolated text, and `v-html` is the one construct
      # that opts out of it — which in an app rendering user-authored event
      # titles and chat messages is an XSS injection point by definition.
      # Enforced by grep rather than eslint-plugin-vue: ESLint does not parse
      # `.vue` files here, so a lint rule would silently cover nothing.
      - name: Reject v-html in Vue components
        run: |
          if grep -rn 'v-html' --include='*.vue' --include='*.ts' apps 2>/dev/null; then
            echo "::error::v-html is banned repo-wide — it defeats Vue's escaping (threat T5.1)."
            exit 1
          fi
          echo "No v-html found."

      # Belt and braces against committing a credential. .env is gitignored, but a
      # forced add or a stray file should fail loudly rather than merge quietly.
      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production|development)$'; then
            echo "::error::An .env file is tracked by git. Secrets must never be committed."
            exit 1
          fi
          echo "No tracked .env files."

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Real Postgres and Redis. The capacity (ADR-0006) and ledger (ADR-0007)
    # guarantees are database guarantees — testing them against a mock would prove
    # nothing about the property we actually care about.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payetam
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payetam
          TZ: UTC
          PGTZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payetam -d payetam"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Integration tests import workspace packages by name (@payetam/db), which
      # resolve to their emitted dist. Without this they fail on a missing module
      # rather than on anything they are meant to be testing.
      - name: Build workspace packages
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @payetam/db db:migrate:deploy

      # Some guarantees cannot be expressed in schema.prisma (partial unique
      # indexes, append-only triggers). `prisma migrate dev` would happily generate
      # a migration dropping them. Fail the build if one goes missing from a freshly
      # migrated database, so the loss is loud rather than silent.
      - name: Protect hand-written database guarantees
        run: |
          missing=0
          check_index() {
            found=$(psql "$DATABASE_URL" -tAc \
              "SELECT count(*) FROM pg_indexes WHERE indexname = '$1';")
            [ "$found" = "1" ] || { echo "::error::missing index $1"; missing=1; }
          }
          check_trigger() {
            found=$(psql "$DATABASE_URL" -tAc \
              "SELECT count(*) FROM pg_trigger WHERE tgname = '$1' AND NOT tgisinternal;")
            [ "$found" = "1" ] || { echo "::error::missing trigger $1"; missing=1; }
          }
          check_constraint() {
            found=$(psql "$DATABASE_URL" -tAc \
              "SELECT count(*) FROM pg_constraint WHERE conname = '$1';")
            [ "$found" = "1" ] || { echo "::error::missing constraint $1"; missing=1; }
          }
          check_index      policy_version_one_current_per_type
          check_trigger    audit_log_append_only
          check_trigger    consent_append_only
          check_trigger    coin_ledger_append_only
          check_constraint coin_account_balance_non_negative
          check_constraint coin_ledger_arithmetic
          check_constraint coin_ledger_amount_non_zero
          # The trust half of ADR-0007 (M9). The score is *defined* as the sum of
          # these rows, so a deleted one is not lost history — it is a wrong
          # number with nothing left to discover that it is wrong.
          check_trigger    trust_score_ledger_append_only
          check_constraint trust_score_within_range
          check_constraint trust_score_ledger_arithmetic
          check_constraint trust_score_ledger_within_range
          check_constraint trust_score_ledger_reversal_pairing
          check_index      trust_score_ledger_idempotency_key_key
          check_index      trust_score_ledger_reverses_ledger_id_key
          # T6. One referrer per person for life, and inviting yourself is not a
          # referral — both decided by the database, because the service checks
          # are one refactor away from being skipped.
          check_index      referral_referred_user_id_key
          check_index      user_referral_code_key
          check_constraint referral_not_self
          check_constraint referral_qualified_at_matches_status
          check_constraint referral_reward_needs_qualification
          check_constraint event_accepted_count_within_capacity
          check_constraint event_cost_amount_matches_type
          check_constraint event_external_link_https
          check_constraint moderation_case_auto_records_version
          # Without this trigger `search_vector` is never filled, and every text
          # query quietly returns nothing — a failure that looks like "no results"
          # rather than like a broken database.
          check_trigger    event_search_vector_sync
          check_index      event_search_vector_idx
          check_index      event_title_trgm_idx
          check_index      event_published_recent_idx
          check_index      event_upcoming_idx
          # Invariant 4. The join path inserts with ON CONFLICT DO NOTHING and
          # reads the row count, so without this index a duplicate request stops
          # being impossible and starts being merely unlikely.
          check_index      event_participant_event_id_user_id_key
          # The FIFO queue promotion reads (ADR-0011). Losing it does not change
          # an answer, it changes a sequential scan into the hot path.
          check_index      event_participant_waitlist_idx
          check_constraint event_participant_accepted_at_matches_status
          check_constraint event_participant_cancelled_at_present
          check_constraint event_participant_promoted_not_waitlisted
          check_constraint event_participant_penalty_needs_bucket
          # The relay's queue (M13 drains it). Without the partial predicate this
          # index grows with every domain event the product has ever emitted
          # rather than with the backlog.
          check_index      outbox_event_unprocessed_idx
          check_constraint outbox_event_attempts_non_negative
          # Anonymous chat (M8). These are the guarantees the highest-risk feature
          # in the product leans on, so losing one silently is the worst case:
          # one chat per request, one alias per side, and gap-free per-chat
          # ordering that makes "everything after seq N" a correct read.
          check_index      anonymous_chat_participant_id_key
          check_index      chat_participant_chat_id_alias_index_key
          check_index      chat_message_chat_id_seq_key
          # The edit path (D10) and the M15 purge. Both partial; without the
          # predicate they index every message ever sent instead of the few rows
          # each one is about.
          check_index      chat_message_source_idx
          check_index      chat_message_retention_idx
          check_index      anonymous_chat_retention_idx
          # A closed chat that carries no purge date is a private conversation
          # nothing ever deletes, and a live one that carries one is a
          # conversation deleted mid-flight.
          check_constraint anonymous_chat_closed_is_complete
          check_constraint anonymous_chat_live_has_no_retention
          check_constraint anonymous_chat_opened_at_matches_status
          # A body that will not decrypt, caught at write time rather than when
          # somebody opens the conversation.
          check_constraint chat_message_nonce_length
          check_constraint chat_message_body_holds_tag
          check_constraint chat_message_sender_matches_kind
          check_constraint chat_participant_alias_index_matches_role
          # `chat_action` records a consent decision made inside a private
          # conversation. Evidence that can be edited is not evidence.
          check_trigger    chat_action_append_only
          # Blind reviews (M11). Invariant 6 is the unique index; the rest keep a
          # pair from claiming a state its contents contradict — a REVEALED pair
          # holding nothing would render as a profile with no reviews and no
          # explanation, which is indistinguishable from the feature being broken.
          check_index      review_participant_id_reviewer_user_id_key
          check_index      review_pair_participant_id_key
          check_index      review_pair_due_idx
          check_constraint review_rating_within_scale
          check_constraint review_not_self
          check_constraint review_comment_length
          check_constraint review_tags_bounded
          check_constraint review_revealed_at_matches_status
          check_constraint review_pair_window_ordered
          check_constraint review_pair_status_matches_contents
          check_constraint review_pair_revealed_at_matches_status
          # Reports and the admin surface (M12). The first index is invariant 5,
          # and it is also what makes the auto-hide threshold count *people*:
          # without it, one determined reporter could hide anybody's event.
          check_index      report_target_type_target_id_reporter_user_id_key
          check_index      admin_user_email_key
          check_constraint report_description_length
          check_constraint admin_user_failed_attempts_non_negative
          # Four-eyes on role changes (ADR-0010 rule 4), in the database — the
          # service check is one refactor away from being skipped, and this is
          # what stops one compromised account becoming every role at once.
          check_constraint role_change_request_needs_second_pair_of_eyes
          check_constraint role_change_request_decided_at_matches_status
          # Break-glass (T14). A grant that never expires is standing access, and
          # a reason nobody has to write is a reason nobody writes.
          check_constraint chat_unseal_grant_is_time_boxed
          check_constraint chat_unseal_grant_reason_present
          check_constraint chat_unseal_grant_read_count_non_negative
          exit $missing
        env:
          DATABASE_URL: postgresql://payetam:ci@localhost:5432/payetam
          PGPASSWORD: ci

      - name: Integration tests
        run: pnpm test --project integration
